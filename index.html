    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    color:var(--cream);
    position:relative;
    overflow-x:hidden;
  }

  /* subtle darken overlay so text stays readable everywhere */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:linear-gradient(
      to bottom,
      rgba(20,8,4,0.35) 0%,
      rgba(20,8,4,0.05) 22%,
      rgba(20,8,4,0.05) 62%,
      rgba(20,8,4,0.55) 100%
    );
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding:clamp(16px,4vw,36px);
  }

  header.hero{
    text-align:center;
    margin-top:clamp(10px,4vh,48px);
  }

  .eyebrow{
    font-size:13px;
    letter-spacing:0.12em;
    color:var(--cream-dim);
    font-weight:500;
    margin:0 0 6px;
  }

  h1.title{
    font-family:'Yatra One',cursive;
    font-size:clamp(2.6rem,8vw,4.6rem);
    line-height:1.1;
    margin:0;
    color:var(--cream);
    text-shadow:0 2px 18px rgba(0,0,0,0.55), 0 0 40px rgba(226,89,43,0.25);
  }

  p.tagline{
    font-size:clamp(0.95rem,2.2vw,1.15rem);
    color:var(--cream-dim);
    margin:10px 0 0;
    font-weight:500;
  }

  .spacer{flex:1;}

  .list-toggle-row{
    display:flex;
    justify-content:center;
    margin-bottom:16px;
  }

  .list-toggle{
    background:rgba(20,8,4,0.55);
    border:1px solid rgba(242,169,59,0.45);
    color:var(--cream);
    font-family:'Mukta',sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.03em;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    gap:7px;
    box-shadow:0 4px 18px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.03);
    transition:background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .list-toggle:hover{background:rgba(225,89,43,0.3); border-color:var(--gold);}
  .list-toggle:active{transform:scale(0.97);}
  .list-toggle svg{width:12px;height:12px;flex-shrink:0; color:var(--gold);}

  /* player card */
  .player-card{
    max-width:520px;
    width:100%;
    margin:0 auto;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:10px 14px;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 10px 32px rgba(0,0,0,0.35);
    display:flex;
    align-items:center;
    gap:12px;
  }

  .now-playing-row{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
    flex:1;
  }

  .video-frame{
    width:52px;
    height:52px;
    border-radius:10px;
    overflow:hidden;
    flex-shrink:0;
    background:#000;
    border:1px solid rgba(242,169,59,0.3);
    position:relative;
  }
  .video-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .mini-eq{
    position:absolute;
    bottom:3px;
    right:3px;
    width:16px;
    height:12px;
    background:rgba(0,0,0,0.55);
    border-radius:4px;
    display:none;
    align-items:flex-end;
    justify-content:center;
    gap:2px;
    padding:2px 3px;
  }
  .mini-eq.active{display:flex;}
  .mini-eq span{
    width:2.5px;
    background:var(--gold);
    border-radius:2px;
    animation:eqBounce 0.9s ease-in-out infinite;
  }
  .mini-eq span:nth-child(1){height:40%; animation-delay:0s;}
  .mini-eq span:nth-child(2){height:90%; animation-delay:0.2s;}
  .mini-eq span:nth-child(3){height:60%; animation-delay:0.4s;}

  .track-info{
    min-width:0;
    flex:1;
  }
  .track-title{
    font-size:13.5px;
    font-weight:700;
    color:var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin:0 0 2px;
  }
  .track-artist{
    font-size:11.5px;
    color:var(--cream-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin:0;
  }

  .transport{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    flex-shrink:0;
  }

  .transport button{
    background:none;
    border:none;
    color:var(--cream);
    cursor:pointer;
    padding:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform 0.15s ease, color 0.15s ease;
  }
  .transport button:hover{color:var(--gold);}
  .transport button:active{transform:scale(0.9);}
  .transport svg{width:17px;height:17px;}

  .transport .play-btn{
    width:38px;height:38px;
    border-radius:50%;
    background:var(--marigold);
    color:#fff;
  }
  .transport .play-btn:hover{background:var(--gold); color:var(--ink);}
  .transport .play-btn svg{width:16px;height:16px;}

  .track-counter{
    display:none;
  }

  footer{
    text-align:center;
    padding:22px 0 6px;
    font-size:12.5px;
    color:var(--cream-dim);
  }
  footer span.heart{color:var(--marigold);}

  /* song list overlay */
  .overlay-backdrop{
    position:fixed;
    inset:0;
    background:rgba(15,6,3,0.55);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    z-index:10;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .overlay-backdrop.open{display:flex;}

  .song-panel{
    width:100%;
    max-width:380px;
    max-height:min(70vh,520px);
    background:linear-gradient(180deg, rgba(59,20,8,0.98), rgba(31,10,4,0.99));
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:14px 8px 10px;
    display:flex;
    flex-direction:column;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
    animation:popIn 0.18s ease;
  }
  @keyframes popIn{
    from{transform:scale(0.96); opacity:0;}
    to{transform:scale(1); opacity:1;}
  }

  .song-panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 8px 10px;
    border-bottom:1px solid rgba(242,169,59,0.18);
    margin-bottom:4px;
  }
  .song-panel-header h2{
    font-family:'Yatra One',cursive;
    font-size:19px;
    margin:0;
    color:var(--gold);
    font-weight:400;
  }
  .close-btn{
    background:rgba(242,169,59,0.15);
    border:none;
    color:var(--cream);
    width:28px;height:28px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .close-btn svg{width:14px;height:14px;}

  .song-list{
    overflow-y:auto;
    padding:2px 4px;
  }

  .song-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 8px;
    border-radius:10px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .song-item:hover{background:rgba(242,169,59,0.1);}
  .song-item.active{background:rgba(225,89,43,0.25);}

  .song-index{
    width:20px;
    text-align:center;
    font-size:12px;
    color:var(--cream-dim);
    flex-shrink:0;
  }
  .song-item.active .song-index{color:var(--gold);}

  .song-thumb{
    width:38px;height:38px;
    border-radius:7px;
    object-fit:cover;
    flex-shrink:0;
    background:#000;
  }

  .song-meta{min-width:0; flex:1;}
  .song-name{
    font-size:13.5px;
    font-weight:600;
    color:var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .song-singer{
    font-size:11.5px;
    color:var(--cream-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .eq{
    width:16px;height:14px;
    display:none;
    align-items:flex-end;
    gap:2px;
    flex-shrink:0;
  }
  .song-item.active .eq{display:flex;}
  .eq span{
    width:3px;
    background:var(--gold);
    border-radius:2px;
    animation:eqBounce 0.9s ease-in-out infinite;
  }
  .eq span:nth-child(1){height:40%; animation-delay:0s;}
  .eq span:nth-child(2){height:90%; animation-delay:0.2s;}
  .eq span:nth-child(3){height:60%; animation-delay:0.4s;}
  @keyframes eqBounce{
    0%,100%{transform:scaleY(0.4);}
    50%{transform:scaleY(1);}
  }

  @media (max-width:480px){
    .video-frame{width:96px;height:54px;}
    .track-title{font-size:14px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <p class="eyebrow">छठ पूजा • सूर्य उपासना</p>
    <h1 class="title">जय छठी मैया</h1>
  </header>

  <div class="spacer"></div>

  <div class="list-toggle-row">
    <button class="list-toggle" id="openListBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      <span>Song List</span>
    </button>
  </div>

  <div class="player-card">
    <div class="now-playing-row">
      <div class="video-frame">
        <img id="thumbImg" src="" alt="Song thumbnail">
        <div class="mini-eq" id="miniEq"><span></span><span></span><span></span></div>
      </div>
      <div class="track-info">
        <p class="track-title" id="trackTitle">—</p>
        <p class="track-artist" id="trackArtist">—</p>
      </div>
    </div>
    <div class="transport">
      <button id="prevBtn" title="पिछला गीत" aria-label="Previous song">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="play-btn" id="playBtn" title="Play/Pause" aria-label="Play or pause">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="nextBtn" title="अगला गीत" aria-label="Next song">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-9.5 6L15 18V6z" transform="scale(-1,1) translate(-24,0)"/></svg>
      </button>
    </div>
    <p class="track-counter" id="trackCounter">1 / 8</p>
  </div>

  <footer>Made with <span class="heart">❤</span> by Sahil Singh</footer>
</div>

<div id="ytPlayerHost" style="position:absolute;width:1px;height:1px;overflow:hidden;left:-9999px;top:-9999px;"></div>

<div class="overlay-backdrop" id="overlay">
  <div class="song-panel">
    <div class="song-panel-header">
      <h2>Song List</h2>
      <button class="close-btn" id="closeListBtn" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="song-list" id="songList"></div>
  </div>
</div>

<script>
  var playlist = [
    { title: "केलवा के पात पर", en: "Kelwa Ke Paat Par", artist: "Sharda Sinha", id: "29JynZfMoe4" },
    { title: "उगs हे सूरज देव", en: "Uga Hai Suraj Dev", artist: "Anuradha Paudwal", id: "jP_xLwVl58M" },
    { title: "पहिले पहिल छठी मईया", en: "Pahile Pahil Chhathi Maiya", artist: "Sharda Sinha", id: "DG8F-csoRAQ" },
    { title: "काँच ही बाँस के बहंगिया", en: "Kaanch Hi Baans Ke Bahangiya", artist: "Anuradha Paudwal", id: "HlwdeEK2rY8" },
    { title: "काँच ही बाँस के बहंगिया", en: "Kaanch Hi Baans Ke Bahangiya", artist: "Maithili Thakur, Rishav Thakur & Ayachi Thakur", id: "dr0DBndeOuA" },
    { title: "काँच ही बाँस के बहंगिया", en: "Kaanch Hi Baans Ke Bahangiya", artist: "Golu Raj & Priyanka Singh", id: "N7urlyirud4" },
    { title: "सोना सटकुनिया हो दीनानाथ", en: "Sona Satkuniya Ho Dinanaath", artist: "Maithili Thakur", id: "fwX2g9jjo1o" },
    { title: "उगा हो सूरजदेव", en: "Uga Ho Surajdev", artist: "Maithili Thakur", id: "TjH3jsybNJA" }
  ];

  var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

  var currentIndex = 0;
  var player = null;
  var playerReady = false;
  var isPlaying = false;
  var pendingAutoplay = false;

  var thumbImg = document.getElementById('thumbImg');
  var miniEq = document.getElementById('miniEq');
  var trackTitle = document.getElementById('trackTitle');
  var trackArtist = document.getElementById('trackArtist');
  var trackCounter = document.getElementById('trackCounter');
  var songListEl = document.getElementById('songList');
  var overlay = document.getElementById('overlay');
  var playBtn = document.getElementById('playBtn');

  function updateThumb(){
    thumbImg.src = "https://i.ytimg.com/vi/" + playlist[currentIndex].id + "/mqdefault.jpg";
  }

  function updatePlayIcon(){
    playBtn.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
    miniEq.classList.toggle('active', isPlaying);
  }

  function renderSongList(){
    songListEl.innerHTML = '';
    playlist.forEach(function(song, i){
      var item = document.createElement('div');
      item.className = 'song-item' + (i === currentIndex ? ' active' : '');
      item.innerHTML =
        '<span class="song-index">' + (i+1) + '</span>' +
        '<img class="song-thumb" src="https://i.ytimg.com/vi/' + song.id + '/default.jpg" alt="">' +
        '<div class="song-meta">' +
          '<div class="song-name">' + song.title + '</div>' +
          '<div class="song-singer">' + song.artist + '</div>' +
        '</div>' +
        '<div class="eq"><span></span><span></span><span></span></div>';
      item.addEventListener('click', function(){
        loadTrack(i, true);
        closeOverlay();
      });
      songListEl.appendChild(item);
    });
  }

  function loadTrack(index, autoplay){
    currentIndex = ((index % playlist.length) + playlist.length) % playlist.length;
    var song = playlist[currentIndex];
    trackTitle.textContent = song.title + ' · ' + song.en;
    trackArtist.textContent = song.artist;
    trackCounter.textContent = (currentIndex + 1) + ' / ' + playlist.length;
    updateThumb();
    renderSongList();

    if(playerReady){
      if(autoplay){
        player.loadVideoById(song.id);
      } else {
        player.cueVideoById(song.id);
      }
    } else {
      pendingAutoplay = autoplay;
    }
  }

  function togglePlay(){
    if(!playerReady) return;
    if(isPlaying){
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  }

  function openOverlay(){ overlay.classList.add('open'); }
  function closeOverlay(){ overlay.classList.remove('open'); }

  document.getElementById('openListBtn').addEventListener('click', openOverlay);
  document.getElementById('closeListBtn').addEventListener('click', closeOverlay);
  overlay.addEventListener('click', function(e){
    if(e.target === overlay) closeOverlay();
  });

  document.getElementById('prevBtn').addEventListener('click', function(){
    loadTrack(currentIndex - 1, true);
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    loadTrack(currentIndex + 1, true);
  });
  playBtn.addEventListener('click', togglePlay);

  // initial UI state before API loads
  updateThumb();
  trackTitle.textContent = playlist[0].title + ' · ' + playlist[0].en;
  trackArtist.textContent = playlist[0].artist;
  trackCounter.textContent = '1 / ' + playlist.length;
  renderSongList();

  // Load the official YouTube IFrame Player API
  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player('ytPlayerHost', {
      height: '1',
      width: '1',
      videoId: playlist[currentIndex].id,
      playerVars: { autoplay: 0, controls: 0, modestbranding: 1, playsinline: 1, rel: 0 },
      events: {
        onReady: function(){
          playerReady = true;
          if(pendingAutoplay){
            player.playVideo();
            pendingAutoplay = false;
          }
        },
        onStateChange: function(e){
          if(e.data === YT.PlayerState.PLAYING){
            isPlaying = true;
            updatePlayIcon();
          } else if(e.data === YT.PlayerState.PAUSED){
            isPlaying = false;
            updatePlayIcon();
          } else if(e.data === YT.PlayerState.ENDED){
            loadTrack(currentIndex + 1, true);
          }
        }
      }
    });
  };

  var ytScriptTag = document.createElement('script');
  ytScriptTag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(ytScriptTag);
</script>

</body>
</html>
